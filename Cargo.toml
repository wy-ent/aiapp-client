[workspace]
resolver = "2"
members = [
    "crates/aiapp-web",
    "crates/aiapp-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tower-http = { version = "0.5", features = ["fs"] }

[profile.release]
strip = true
