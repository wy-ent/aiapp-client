<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiapp-mb · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f5;            /* Light warm-beige background */
    --panel: #ffffff;
    --panel-2: #f1efe7;       /* Secondary warm panel */
    --border: #e3dfd3;        /* Light Gray */
    --text: #141413;          /* Dark charcoal text */
    --muted: #6f6d64;         /* Secondary text */
    --accent: #d97757;        /* Orange primary accent */
    --accent-2: #a8553a;      /* Dark orange: accent text/hover */
    --ok: #788c5d;            /* Green */
    --err: #b3412c;
    --tag-bg: #f3f0e8;
    --tag-border: #ded9ca;
    --overlay: rgba(20,20,19,0.55);
    --font-head: "Poppins", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: "Lora", Georgia, "PingFang SC", "Microsoft YaHei", serif;
    --shadow: 0 10px 30px rgba(20,20,19,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Headings uniformly use the brand heading font Poppins */
  .nav-tab, .mode-btn, .sec-title, .win-name, .modal h3, .auth-tab,
  .admin-card h3, .stat-card .num, .tv-title, .mem-done, .app-mini-card h3,
  .gen-toggle, .gen-submit, .custom-gen, .login-btn, .m-btn.primary {
    font-family: var(--font-head);
  }

  /* ===== Top bar ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    flex-wrap: wrap;
  }
  .topbar .logo {
    font-size: 20px; font-weight: 800; font-family: var(--font-head);
    background: linear-gradient(135deg, #d97757, #a8553a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer; white-space: nowrap;
  }
  .topbar .logo small { font-size: 12px; -webkit-text-fill-color: var(--muted); }
  .topbar-left { display: flex; align-items: center; gap: 18px; }
  .nav-tabs { display: flex; gap: 6px; }
  .nav-tab {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer;
    transition: all .15s;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .topbar .gen-toggle {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s; white-space: nowrap;
  }
  .topbar .gen-toggle:hover { background: var(--accent-2); }
  .topbar .gen-toggle.on { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .topbar .stats { font-size: 13px; color: var(--muted); }
  .lang-switch { display: flex; gap: 4px; align-items: center; }
  .lang-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .lang-btn:hover { color: var(--text); }
  .lang-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ===== Generator drawer ===== */
  .gen-drawer {
    display: none; background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 20px 24px; position: sticky; top: 52px; z-index: 49;
  }
  .gen-drawer.show { display: block; }
  .gen-drawer .mode-switch { display: flex; gap: 6px; margin-bottom: 12px; }
  .gen-drawer .mode-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .gen-drawer .mode-btn:hover { color: var(--text); }
  .gen-drawer .mode-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .gen-drawer .update-target {
    display: flex; gap: 10px; align-items: center; margin-bottom: 12px;
    padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--muted);
  }
  .gen-drawer .update-target select {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  .gen-drawer textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-family: inherit;
    outline: none; min-height: 70px; resize: vertical;
  }
  .gen-drawer textarea:focus { border-color: var(--accent); }
  .gen-drawer .gen-row {
    display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap;
  }
  .gen-drawer .tpl-mini { display: flex; gap: 6px; flex-wrap: wrap; }
  .tpl-mini-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .tpl-mini-btn:hover { border-color: var(--muted); }
  .tpl-mini-btn.on { border-color: var(--accent); color: var(--accent-2); }
  .gen-drawer .gen-submit {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin-left: auto;
  }
  .gen-drawer .gen-submit:hover { background: var(--accent-2); }
  .gen-drawer .gen-submit:disabled { opacity: .5; cursor: not-allowed; }
  .gen-drawer .gen-result { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .gen-result .res-actions { display: flex; gap: 8px; margin-top: 8px; }
  .gen-result .res-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; font-size: 12px; color: var(--text); cursor: pointer; transition: all .15s;
  }
  .gen-result .res-btn:hover { border-color: var(--accent); }
  .gen-result .res-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ===== Home page ===== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; }

  .avail-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .avail-switch { display: flex; gap: 6px; align-items: center; }
  .avail-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 18px; font-size: 13px;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .avail-btn:hover { border-color: var(--muted); color: var(--text); }
  .avail-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .avail-btn.on.warn { background: #fbf3e0; border-color: #8a6a1f; color: #8a6a1f; }
  .current-device {
    font-size: 12px; color: var(--muted); margin-left: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .current-device .dev-badge {
    background: var(--tag-bg); color: var(--accent-2);
    border: 1px solid var(--tag-border); border-radius: 4px; padding: 2px 8px;
    font-size: 11px;
  }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filter-bar .label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .filter-chip {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 12px;
    color: var(--muted); cursor: pointer; transition: all .15s;
    user-select: none;
  }
  .filter-chip:hover { border-color: var(--muted); color: var(--text); }
  .filter-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-chip.tag { border-radius: 4px; }

  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .app-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .app-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .app-grid { grid-template-columns: 1fr; } }
  .app-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 2px rgba(20,20,19,0.04);
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .app-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }
  .app-card .app-thumb {
    width: 100%; height: 120px; object-fit: cover; display: block;
    background: linear-gradient(135deg, #f1efe7 0%, #e3dfd3 100%);
  }
  .app-card .app-body { padding: 14px; }
  .app-card .app-name { font-size: 15px; font-weight: 700; font-family: var(--font-head); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .app-card .app-name .not-sup { font-size: 13px; }
  .vis-badge {
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 7px;
  }
  .vis-badge.private { background: #fbf3e0; color: #8a6a1f; border: 1px solid #e5d5a8; }
  .vis-badge.public { background: #eef3e4; color: #5c7044; border: 1px solid #cdd8b4; }
  .vis-badge.review { background: #eaf2fb; color: #3f6fa8; border: 1px solid #c3d8ef; }
  .vis-badge.danger { background: #fbeaec; color: #a84654; border: 1px solid #edc8cd; }
  .ver-badge {
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 7px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  }
  /* Category / share badges */
  .app-meta-line { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .cat-badge {
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 7px;
    background: #f3efe9; color: #7a6a55; border: 1px solid #e0d7c8;
  }
  .share-badge {
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 7px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  }
  .share-badge.pub { background: #eef3e4; color: #5c7044; border: 1px solid #cdd8b4; }
  .share-badge.org { background: #eaf2fb; color: #3f6fa8; border: 1px solid #c3d8ef; }
  /* Generator category row */
  .gen-drawer .cat-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .gen-drawer .gen-cat-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .gen-drawer .gen-cat-hint { font-size: 11px; color: var(--accent-2); }
  .gen-drawer select {
    flex: 1; min-width: 120px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-size: 13px;
  }
  /* Publish modal share scope */
  .share-options { display: flex; gap: 8px; margin-top: 6px; }
  .share-opt {
    flex: 1; display: flex; align-items: flex-start; gap: 8px;
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
    cursor: pointer; background: var(--panel-2);
  }
  .share-opt b { font-size: 13px; display: block; }
  .share-opt small { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; line-height: 1.4; }
  .share-opt input { margin-top: 2px; accent-color: var(--accent); }
  .app-card .app-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .app-card .app-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .app-tag {
    font-size: 11px; background: var(--tag-bg); color: var(--accent-2);
    border: 1px solid var(--tag-border); border-radius: 4px; padding: 2px 7px;
  }
  .app-card .app-platforms { display: flex; gap: 4px; flex-wrap: wrap; }
  .plat-badge {
    font-size: 11px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
  }
  /* Online / local badge */
  .app-card .app-net { display: flex; gap: 4px; margin-bottom: 10px; }
  .net-badge {
    font-size: 11px; font-weight: 600; border-radius: 4px; padding: 2px 7px;
    border: 1px solid;
  }
  .net-badge.online { background: #eaf2fb; color: #3f6fa8; border-color: #c3d8ef; }
  .net-badge.local  { background: #eef3e4; color: #5c7044; border-color: #cdd8b4; }
  /* Instant-launch button */
  .launch-btn {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 10px;
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .launch-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .launch-btn.lg { width: 100%; justify-content: center; padding: 9px 14px; font-size: 14px; }
  /* My Apps card action buttons */
  .my-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .my-btn {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 6px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .my-btn:hover { border-color: var(--accent); color: var(--text); }
  .my-btn.publish { background: var(--accent); border-color: var(--accent); color: #fff; }
  .my-btn.launch { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .my-btn.uninstall { border-color: var(--err); color: var(--err); }
  .my-btn.uninstall:hover { background: var(--err); color: #fff; }
  .my-btn.danger:hover { border-color: var(--err); color: var(--err); }
  .market-empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .market-empty .big { font-size: 40px; margin-bottom: 12px; }
  .market-empty p { font-size: 14px; line-height: 1.6; }

  .sec-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .sec-title .sub { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* ===== App window ===== */
  .app-window {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: var(--overlay); backdrop-filter: blur(4px);
  }
  .app-window.show { display: flex; align-items: center; justify-content: center; }
  .app-window .window-frame {
    width: 90%; max-width: 680px; max-height: 85vh;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: windowIn .2s ease;
  }
  @keyframes windowIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .app-window.fully .window-frame {
    width: 100%; max-width: 100%; height: 100%; max-height: 100%;
    border-radius: 0; border: none; border-left: 1px solid var(--border);
  }
  .app-window .window-body { flex: 1; overflow: auto; padding: 20px; min-height: 300px; }
  .app-window .window-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .app-window .window-titlebar .win-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .app-window .window-titlebar .win-name { font-size: 15px; font-weight: 700; }
  .app-window .window-titlebar .win-platforms { display: flex; gap: 4px; }
  .app-window .window-titlebar .win-actions { display: flex; gap: 8px; }
  .win-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .win-btn:hover { background: var(--panel-2); color: var(--text); }
  .win-btn.close:hover { background: #b3412c; color: #fff; border-color: #b3412c; }
  .app-window .mock-content {
    font-family: "SF Mono", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.6; white-space: pre; color: var(--text);
    background: #f4f2ea; border: 1px solid var(--border); border-radius: 10px; padding: 20px;
  }
  .app-window .run-area { display: flex; flex-direction: column; gap: 12px; }
  .app-window .run-toolbar { display: flex; align-items: center; gap: 12px; }
  .app-window .run-btn {
    background: linear-gradient(135deg, #d97757, #a8553a); color: #fff; border: 0;
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .app-window .run-btn:disabled { opacity: .6; cursor: default; }
  .app-window .run-status { font-size: 12px; color: var(--muted); }
  .app-window .run-output {
    font-family: "SF Mono", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    color: var(--text); background: #f4f2ea; border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; min-height: 120px;
  }
  .app-window .run-output.err { color: #b3412c; }
  .app-window .window-owner {
    display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border); padding: 10px 18px; background: var(--panel);
  }
  .app-window .window-source {
    border-top: 1px solid var(--border); padding: 14px 18px; background: var(--panel-2);
  }
  .app-window .window-source .custom-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .app-window .custom-btns { display: flex; gap: 8px; align-items: center; }
  .app-window .custom-gen {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .app-window .custom-gen:hover { background: var(--accent-2); }
  .app-window .report-btn {
    font-size: 12px; color: var(--muted); cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; transition: all .15s;
  }
  .app-window .report-btn:hover { border-color: var(--err); color: var(--err); }

  /* ===== Interactive app UI (real operable UI rendered per template) ===== */
  .app-ui { display: flex; flex-direction: column; gap: 14px; }
  .app-mini-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .app-mini-card h3 { margin: 0 0 8px; font-size: 15px; }
  .app-mini-card p { margin: 4px 0; color: var(--muted); font-size: 13px; }
  /* Todo */
  .todo-add { display: flex; gap: 8px; }
  .todo-add input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); }
  .todo-add button { padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  .todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .todo-item { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-item .todo-del { margin-left: auto; cursor: pointer; color: var(--muted); border: none; background: none; font-size: 16px; }
  .todo-item .todo-del:hover { color: var(--err); }
  /* Image filter */
  .img-filter { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .img-filter canvas { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); background: #f4f2ea; }
  .img-filter .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .img-filter .filter-bar button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; }
  .img-filter .filter-bar button:hover { background: var(--panel-2); }
  /* Focus pomodoro */
  .pomodoro .pm-ring { text-align: center; padding: 20px 0 8px; }
  .pomodoro .pm-time { font-size: 46px; font-weight: 800; font-family: var(--font-head); letter-spacing: 2px; }
  .pomodoro .pm-mode { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .pomodoro .pm-progress { height: 8px; background: var(--panel-2); border-radius: 999px; margin: 14px auto 0; max-width: 320px; overflow: hidden; }

  .memory .mem-card {

  .tv .tv-cats { display: flex; gap: 8px; flex-wrap: wrap; }

  .tv .tv-cat.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tv .tv-list { display: flex; flex-direction: column; gap: 8px; }

    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tv .tv-num { font-size: 16px; }
  .tv .tv-title { flex: 1; font-size: 15px; font-weight: 600; }
  .tv .tv-cat-tag { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px; }
  .tv .tv-fav { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px; }
  .tv .tv-fav:hover { border-color: var(--accent); color: var(--text); }
  .tv .tv-empty { text-align: center; color: var(--muted); padding: 20px; }
  .tv .tv-add { display: flex; gap: 8px; }
  .tv .tv-add input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; }
  .tv .tv-add select { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px; }
  .tv .tv-addbtn { padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent);
    color: #fff; cursor: pointer; font-weight: 600; }

  /* ===== Task bar ===== */
  .taskbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 6px 16px; display: none; gap: 6px; align-items: center;
  }
  .taskbar.show { display: flex; }
  .taskbar .task-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
  .task-icon {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
    font-size: 12px; transition: all .15s;
  }
  .task-icon:hover { border-color: var(--accent); }
  .task-icon .task-close {
    font-size: 14px; color: var(--muted); margin-left: 4px;
    width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .task-icon .task-close:hover { background: #b3412c; color: #fff; }

  /* ===== Publish modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: var(--overlay); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    width: 92%; max-width: 440px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px;
    animation: windowIn .2s ease;
  }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal .modal-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal .m-btn {
    padding: 9px 20px; border-radius: 8px; font-size: 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    transition: all .15s;
  }
  .modal .m-btn:hover { border-color: var(--muted); }
  .modal .m-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal .m-btn.primary:hover { background: var(--accent-2); }

  /* ===== Login / register ===== */
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .auth-tab {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; color: var(--muted); cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  .auth-tab:hover { color: var(--text); }
  .auth-tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .auth-msg { font-size: 12px; min-height: 16px; margin-top: 8px; }
  .auth-msg.err { color: var(--err); }
  .auth-msg.ok { color: var(--ok); }
  .topbar .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .topbar .user-chip .uname { color: var(--accent-2); font-weight: 600; }
  .topbar .user-chip .role-badge { font-size: 10px; padding: 1px 7px; border-radius: 4px; background: var(--tag-bg); color: var(--accent-2); border: 1px solid var(--tag-border); }
  .topbar .user-chip button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  .topbar .user-chip button:hover { color: var(--text); }
  .topbar .login-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .topbar .login-btn:hover { background: var(--accent-2); }

  /* ===== Admin ===== */
  .admin-layout { display: flex; gap: 20px; align-items: flex-start; }
  .admin-menu {
    width: 210px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; position: sticky; top: 70px;
    flex-shrink: 0;
  }
  .admin-menu-item {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .admin-menu-item:hover { color: var(--text); background: var(--panel-2); }
  .admin-menu-item.on { background: var(--accent); color: #fff; }
  .admin-panel { flex: 1; min-width: 0; }
  .admin-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .admin-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .admin-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--accent-2); }
  .stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th, .admin-table td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .admin-table th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .admin-table tr:hover td { background: var(--panel-2); }
  .a-badge {
    display: inline-block; font-size: 11px; border-radius: 4px;
    padding: 2px 8px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border);
  }
  .a-badge.published { background: #eef3e4; color: #5c7044; border-color: #cdd8b4; }
  .a-badge.reviewing { background: #fbf3e0; color: #8a6a1f; border-color: #e5d5a8; }
  .a-badge.draft { background: #f1efe7; color: #6f6d64; border-color: var(--border); }
  .a-badge.disabled { background: #fbeae4; color: #b3412c; border-color: #e3b8ab; }
  .a-badge.active { background: #eef3e4; color: #5c7044; border-color: #cdd8b4; }
  .a-badge.admin { background: #e8f0f8; color: #3a6f9c; border-color: #bfd6e8; }
  .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .small-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; color: var(--text); cursor: pointer; transition: all .15s;
  }
  .small-btn:hover { border-color: var(--accent); }
  .small-btn.ok { border-color: #7a9458; color: #5c7044; }
  .small-btn.warn { border-color: #b89a45; color: #8a6a1f; }
  .small-btn.danger { border-color: #c96a48; color: #b3412c; }
  .small-btn.danger:hover { background: #fbeae4; }
  .small-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .a-note { font-size: 11px; color: var(--muted); }
  .prompt-box { width: 100%; min-height: 320px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    font-family: "SF Mono", Consolas, monospace; font-size: 13px; line-height: 1.6; outline: none; }
  .prompt-box:focus { border-color: var(--accent); }
  .prompt-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }

  /* ===== Admin search & filter ===== */
  .admin-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .admin-search {
    flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; font-family: var(--font-body);
  }
  .admin-search:focus { border-color: var(--accent); }
  .admin-select {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 13px; cursor: pointer; outline: none;
  }
  .admin-cat-chart { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .cat-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .cat-bar-label { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 70px; }
  .cat-bar-track { flex: 1; height: 20px; background: var(--panel-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .cat-bar-fill { height: 100%; border-radius: 6px; transition: width .3s; }
  .cat-bar-num { font-size: 12px; color: var(--text); font-weight: 600; min-width: 24px; text-align: right; }

  /* ===== Edit modal ===== */
  .edit-modal-overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .edit-modal-overlay.show { display: flex; }
  .edit-modal {
    background: var(--panel); border-radius: 14px; padding: 24px;
    width: 90%; max-width: 520px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto;
  }
  .edit-modal h3 { font-size: 18px; margin-bottom: 16px; }
  .edit-field { margin-bottom: 14px; }
  .edit-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .edit-field input, .edit-field textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; font-family: var(--font-body);
  }
  .edit-field input:focus, .edit-field textarea:focus { border-color: var(--accent); }
  .edit-field textarea { min-height: 80px; resize: vertical; }
  .edit-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .loading-hint { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; }

  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; line-height: 1.8; }

  /* ===== Mobile adaptation ===== */

    .topbar { padding: 10px 14px; }
    .nav-tab { padding: 7px 10px; font-size: 12px; }

    .avail-bar, .filter-bar { gap: 6px; }
    .app-window .window-titlebar { padding: 10px 12px; }

    .app-window .window-body { padding: 14px; }
    .app-window .window-source { padding: 12px; }
    .app-window .window-source .custom-row { flex-wrap: wrap; }
    .app-window .custom-btns { flex-wrap: wrap; }
    .calc-display { font-size: 20px; padding: 12px 12px; }
    .admin-layout { flex-direction: column; gap: 12px; }
    .admin-menu { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 6px; }
    .admin-menu-item { width: auto; padding: 8px 12px; }
    .admin-table th, .admin-table td { padding: 8px 8px; }
  }

    .topbar-left { flex-direction: column; align-items: flex-start; gap: 8px; }
    .topbar-right { width: 100%; justify-content: space-between; }
    .app-card .app-thumb { height: 100px; }
  }

</head>

const CAT_NAMES = Object.fromEntries(APP_CATEGORIES);
// Categories requiring manual review (tool/office auto-approve)
const CAT_REVIEW = ['entertainment', 'game', 'family', 'life', 'industry', 'other'];

function populateCategorySelects() {
  const g = $('genCategory'), p = $('pubCategory');
  const opts = APP_CATEGORIES.map(([k, label]) => `<option value="${k}">${t(label)}</option>`).join('');
  if (g) g.insertAdjacentHTML('beforeend', opts);
  if (p) p.innerHTML = opts;
}

function onCategoryAuto() {
  const cat = $('genCategory').value;
  const hint = $('genCatHint');
  if (!hint) return;
  if (!cat) { hint.textContent = t('Category auto-derived from template'); return; }
  hint.textContent = CAT_REVIEW.includes(cat)
    ? t('This category requires manual review; it enters the review queue after publishing')
    : t('Tool / office categories auto-approve; publish directly after generation');
}

function catLabel(c) {
  return t(CAT_NAMES[c] || 'Other');
}

const $ = id => document.getElementById(id);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

function appShareBadge(a) {
  if (a.share === 'public') return '<span class="share-badge pub">' + t('🌐 Public') + '</span>';
  if (a.share === 'org') return '<span class="share-badge org">' + t('🏢 Org') + '</span>';
  return '<span class="share-badge">' + t('🔒 Private') + '</span>';
}

let currentAdminPanel = 'stats'; // current admin sub-panel
let adminUsers = [];
let adminApps = [];
let adminStats = null;
let authMode = 'login';
let adminAppSearch = '';
let adminAppCatFilter = '';
let adminUserSearch = '';


// ====== Admin system ======
const STATUS_LABEL = {

  const el = $('panelStats');
  const userRows = (d.users || []).map(u => `
    <tr>

  const totalForCat = Object.values(catCounts).reduce((s, v) => s + v, 0) || 1;
  const catColors = { tool: '#d97757', office: '#788c5d', entertainment: '#b89a45', game: '#9b6bbf', family: '#e87b5a', life: '#5b9aa0', industry: '#6f6d64', other: '#a8a39b' };

      <div class="sub">${t('Overview of app usage, providing data for future operations such as user incentives and ad revenue share')}</div>
      <div class="stat-row">

        <div class="stat-card"><div class="num">${d.published}</div><div class="lbl">${t('Published')}</div></div>
        <div class="stat-card"><div class="num">${d.reviewing}</div><div class="lbl">${t('Under Review')}</div></div>
        <div class="stat-card"><div class="num">${d.disabled}</div><div class="lbl">${t('Disabled')}</div></div>
        <div class="stat-card"><div class="num">${d.total_launches}</div><div class="lbl">${t('Total Launches')}</div></div>
        <div class="stat-card"><div class="num">${d.total_users}</div><div class="lbl">${t('Registered Users')}</div></div>
        <div class="stat-card"><div class="num">${d.active_users}</div><div class="lbl">${t('Active Users')}</div></div>
        <div class="stat-card"><div class="num">${d.total_incentive}</div><div class="lbl">${t('Incentives Issued')}</div></div>
      </div>
    </div>
    ${catBars ? `<div class="admin-card">
      <h3>${t('📈 Category Distribution')}</h3>
      <div class="sub">${t('App counts by category')}</div>
      <div class="admin-cat-chart">${catBars}</div>
    </div>` : ''}
    <div class="admin-card">
      <h3>${t('🏆 Top Popular Apps')}</h3>
      <div class="sub">${t('Sorted by launch count')}</div>
      <table class="admin-table">
        <thead><tr><th>#</th><th>${t('App')}</th><th>${t('Owner')}</th><th>${t('Status')}</th><th>${t('Launches')}</th></tr></thead>
        <tbody>${topApps || '<tr><td colspan="5">' + t('No data') + '</td></tr>'}</tbody>
      </table>
    </div>
    <div class="admin-card">
      <h3>${t('👥 User Contribution')}</h3>
      <div class="sub">${t('Generated apps and launches (incentive is placeholder data for a future incentive plan)')}</div>

function appOwnerName(owner) {
  if (owner === 'me') return t('Me');
  const u = adminUsers.find(x => x.id === owner);
  return u ? u.name : owner;
}

// --- App management ---
async function loadAdminApps() {
  const el = $('panelApps');
  if (el) el.innerHTML = `<div class="admin-card"><div class="loading-hint">${t('Loading…')}</div></div>`;
  const res = await fetch('/api/admin/apps');
  const d = await res.json();
  adminApps = d.apps || [];
  renderAdminApps();
}

function getFilteredApps() {
  let list = adminApps;
  if (currentAdminFilter !== 'all') list = list.filter(a => a.status === currentAdminFilter);
  if (adminAppCatFilter) list = list.filter(a => a.category === adminAppCatFilter);
  if (adminAppSearch) {
    const q = adminAppSearch.toLowerCase();
    list = list.filter(a => a.name.toLowerCase().includes(q) || (a.description || '').toLowerCase().includes(q)
      || (a.tags || []).some(t => t.toLowerCase().includes(q)));
  }
  return list;
}

function renderAdminApps() {
  const el = $('panelApps');
  const filtered = getFilteredApps();
  const rows = filtered.map(a => {
    const tags = (a.tags || []).map(t => `<span class="app-tag">${t}</span>`).join('');
    const plat = (a.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join(' ');
    let actions = '';
    if (a.status === 'reviewing') {
      actions = `<button class="small-btn ok" onclick="adminReview('${a.id}','approve')">${t('✅ Approve')}</button>
                 <button class="small-btn danger" onclick="adminReview('${a.id}','reject')">${t('⛔ Reject')}</button>`;
    }
    if (a.status === 'published') {
      actions = `<button class="small-btn warn" onclick="adminStatus('${a.id}','disable')">${t('🛑 Disable')}</button>
                 <button class="small-btn" onclick="adminEditApp('${a.id}')">${t('✏️ Edit')}</button>
                 <button class="small-btn danger" onclick="adminDelete('${a.id}')">${t('🗑 Delete')}</button>`;
    } else if (a.status === 'disabled') {
      actions = `<button class="small-btn ok" onclick="adminStatus('${a.id}','enable')">${t('▶ Restore')}</button>
                 <button class="small-btn" onclick="adminEditApp('${a.id}')">${t('✏️ Edit')}</button>`;
    } else if (a.status === 'draft') {
      actions = `<button class="small-btn ok" onclick="adminStatus('${a.id}','publish')">${t('🚀 Publish')}</button>
                 <button class="small-btn" onclick="adminEditApp('${a.id}')">${t('✏️ Edit')}</button>
                 <button class="small-btn danger" onclick="adminDelete('${a.id}')">${t('🗑 Delete')}</button>`;
    }
    return `<tr>
      <td><b>${esc(a.name)}</b><br><span class="a-note">${esc(appOwnerName(a.owner))}</span></td>
      <td>${admStatusBadge(a.status)}<br><span class="a-note">v${a.version}</span></td>
      <td><span class="cat-badge">${catLabel(a.category)}</span> ${appShareBadge(a)}<br><span class="a-note">${tags || '—'}</span></td>
      <td>${plat || '<span class="a-note">—</span>'}</td>
      <td>${a.launches}</td>
      <td class="a-note">${a.report ? '🚩 ' + esc(a.report) : '—'}</td>
      <td class="a-note">${esc(a.review_note) || '—'}</td>
      <td><div class="admin-actions">${actions}</div></td>
    </tr>`;
  }).join('');
  const catOptions = APP_CATEGORIES.map(([k, label]) =>
    `<option value="${k}" ${adminAppCatFilter === k ? 'selected' : ''}>${t(label)}</option>`).join('');
  el.innerHTML = `
    <div class="admin-card">
      <h3>${t('📦 App Management')}</h3>
      <div class="sub">${t('Review, publish, disable, edit and take down apps. Newly published apps enter "Under Review" and only become public on the market after approval')}</div>
      <div class="admin-toolbar">
        <input class="admin-search" type="text" placeholder="${t('Search apps…')}" value="${esc(adminAppSearch)}" oninput="onAdminAppSearch(this.value)" />
        <select class="admin-select" onchange="onAdminAppCatFilter(this.value)">
          <option value="">${t('All Categories')}</option>
          ${catOptions}
        </select>
      </div>
      <div class="admin-actions" style="margin-bottom:12px">
        <button class="small-btn ${currentAdminFilter==='all'?'on':''}" onclick="setAdminAppFilter('all')">${t('All')}</button>
        <button class="small-btn ${currentAdminFilter==='reviewing'?'on':''}" onclick="setAdminAppFilter('reviewing')">${t('Under Review')}</button>
        <button class="small-btn ok ${currentAdminFilter==='published'?'on':''}" onclick="setAdminAppFilter('published')">${t('Published')}</button>
        <button class="small-btn warn ${currentAdminFilter==='draft'?'on':''}" onclick="setAdminAppFilter('draft')">${t('Draft')}</button>
        <button class="small-btn danger ${currentAdminFilter==='disabled'?'on':''}" onclick="setAdminAppFilter('disabled')">${t('Disabled')}</button>
        <span class="a-note" style="margin-left:auto">${filtered.length}/${adminApps.length}</span>
      </div>
      <table class="admin-table">
        <thead><tr><th>${t('App')}</th><th>${t('Status')}</th><th>${t('Tags')}</th><th>${t('Platforms')}</th><th>${t('Launches')}</th><th>${t('Reports')}</th><th>${t('Review Note')}</th><th>${t('Actions')}</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8">' + t('No data') + '</td></tr>'}</tbody>
      </table>
    </div>`;
}

let currentAdminFilter = 'all';
function onAdminAppSearch(v) { adminAppSearch = v; renderAdminApps(); }
function onAdminAppCatFilter(v) { adminAppCatFilter = v; renderAdminApps(); }

async function setAdminAppFilter(f) {
  currentAdminFilter = f;
  renderAdminApps();
}

async function adminReview(id, action) {
  const note = action === 'reject'
    ? (prompt(t('Please enter the rejection reason:'), '') ?? '') : '';
  const res = await fetch('/api/admin/app/review', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, action, note })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || t('Operation failed')); return; }
  await loadAdminApps();
}

async function adminStatus(id, action) {
  const res = await fetch('/api/admin/app/status', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, action })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || 'Operation failed'); return; }
  await loadAdminApps();
}

async function adminEditApp(id) {
  const a = adminApps.find(x => x.id === id);
  if (!a) return;
  $('editAppId').value = a.id;
  $('editName').value = a.name || '';
  $('editDesc').value = a.description || '';
  $('editTags').value = (a.tags || []).join(', ');
  $('editPlatforms').value = (a.platforms || []).join(', ');
  $('editModal').classList.add('show');
}

function closeEditModal() {
  $('editModal').classList.remove('show');
}

async function submitEditApp() {
  const id = $('editAppId').value;
  const name = $('editName').value.trim();
  const desc = $('editDesc').value.trim();
  const tags = $('editTags').value;
  const platforms = $('editPlatforms').value;
  const res = await fetch('/api/admin/app/edit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id, name,
      description: desc,
      tags: tags.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      platforms: platforms.split(/[,，]/).map(s => s.trim()).filter(Boolean)
    })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || t('Edit failed')); return; }
  closeEditModal();
  await loadAdminApps();
}

async function adminDelete(id) {
  if (!confirm(t('Delete this app? This cannot be undone.'))) return;
  const res = await fetch('/api/admin/app/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || t('Delete failed')); return; }
  await loadAdminApps();
}

// ====== Admin auth (separate admin site) ======
let currentUser = null;     // { id, name, role } or null

async function loadSession() {
  try {
    const res = await fetch('/api/auth/me');
    const d = await res.json();
    if (d.ok && d.user && d.user.role === 'admin') currentUser = d.user;
  } catch (e) { /* not logged in */ }
  renderAuthUI();
  if (currentUser) { setAdminPanel(currentAdminPanel); }
  else { openLogin(); }
}

function renderAuthUI() {
  const el = document.getElementById('authArea');
  if (!el) return;
  if (currentUser) {
    const admin = currentUser.role === 'admin' ? ' <span class="role-badge">' + t('Admin') + '</span>' : '';
    el.innerHTML = `<span class="user-chip"><span class="uname">${esc(currentUser.name)}</span>${admin}<button onclick="logout()">${t('Log out')}</button></span>`;
  } else {
    el.innerHTML = `<button class="login-btn" onclick="openLogin()">${t('Log in / Register')}</button>`;
  }
}

async function logout() {
  currentUser = null;
  renderAuthUI();
  openLogin();
}

function setAuthMode(mode) {
  authMode = mode;
  const submit = document.getElementById('authSubmitBtn');
  if (submit) submit.textContent = mode === 'register' ? t('Register & Log in') : t('Log in');
}

function openLogin() {
  setAuthMode('login');
  const modal = document.getElementById('authModal');
  if (modal) modal.classList.add('show');
  const u = document.getElementById('authUser');
  if (u) u.focus();
}
function closeAuth() {
  const modal = document.getElementById('authModal');
  if (modal) modal.classList.remove('show');
}

async function authSubmit() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  if (!username) { msg.className = 'auth-msg err'; msg.textContent = t('Please enter a username'); return; }
  if (!password) { msg.className = 'auth-msg err'; msg.textContent = t('Please enter a password'); return; }
  if (password.length < 6) { msg.className = 'auth-msg err'; msg.textContent = t('Password must be at least 6 characters'); return; }
  msg.className = 'auth-msg'; msg.textContent = t('Processing…');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await res.json();
    if (!d.ok) { msg.className = 'auth-msg err'; msg.textContent = d.error || t('Operation failed'); return; }
    if (d.user.role !== 'admin') {
      msg.className = 'auth-msg err'; msg.textContent = t('Admin permission required'); return;
    }
    currentUser = d.user;
    msg.className = 'auth-msg ok'; msg.textContent = t('Success, entering…');
    renderAuthUI();
    closeAuth();
    setAdminPanel(currentAdminPanel);
  } catch (e) {
    msg.className = 'auth-msg err'; msg.textContent = t('Network error: {{msg}}', {msg: e.message});
  }
}

// ====== Admin i18n glue (separate site) ======
function setLang(l) {
  if (!SUPPORTED_LANGS.includes(l)) return;
  currentLang = l;
  localStorage.setItem('aiapp_lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  applyStaticI18n();
  if (currentUser) loadAdminPanel(currentAdminPanel);
  renderAuthUI();
}
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('[data-i18n-t]').forEach(el => { el.title = t(el.getAttribute('data-i18n-t')); });
}

// ====== Initialization ======
(async function init() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.dataset.lang === currentLang));
  applyStaticI18n();
  document.querySelectorAll('.admin-menu-item').forEach(b =>
    b.onclick = () => { setAdminPanel(b.dataset.panel); });
  await loadSession();
  // Close edit modal on overlay click / Escape
  $('editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeEditModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });
})();

</script>
