# aiapp-mb deployment orchestration: PostgreSQL metadata + Web service (includes the MoonBit toolchain)
# Usage:
#   One-click (auto-generates secrets, no env file needed):
#     docker compose up -d --build
#
#   Custom configuration (recommended for production):
#     1) cp deploy.env.example deploy.env  and fill in passwords
#     2) docker compose --env-file deploy.env up -d --build
#     3) Open http://<server-ip>:8080
#
# Want to use local SQLite (zero external dependency, single-file database)?
#   - Set DATABASE_URL=sqlite:///data/aiapp.db in deploy.env
#   - Comment out the db: service below and the app's depends_on: db in two places
#   - No PostgreSQL container needed; metadata lands in /data/aiapp.db (the appdata volume is mounted)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiapp123}
      POSTGRES_DB: ${POSTGRES_DB:-aiapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiapp}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # When using SQLite, delete this entire depends_on block (and remove the db: service above)
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # DATABASE_URL taken from deploy.env (defaults to PostgreSQL; change to sqlite:///data/aiapp.db to switch to SQLite)
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-aiapp}:${POSTGRES_PASSWORD:-aiapp123}@db:5432/${POSTGRES_DB:-aiapp}?sslmode=disable}
      # In SQLite mode you can drop REQUIRE_DB (a file database is always reachable); keep it in PostgreSQL mode to enforce persistence
      REQUIRE_DB: "${REQUIRE_DB:-true}"
      # AUTH_SECRET and ADMIN_PASSWORD are auto-generated by the entrypoint if not set (one-click friendly)
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
      STATIC_DIR: /app/templates
      # Tencent Cloud COS (enabled when STORAGE_BACKEND=cos, credentials from deploy.env):
      # object storage supports URL presigning (/api/storage/presign and wasm direct links).
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      MOON_HOME: /data/moon
      AIAPP_BACKEND: ${AIAPP_BACKEND:-mock}
      AIAPP_OPENAI_API_KEY: ${AIAPP_OPENAI_API_KEY:-}
      AIAPP_OPENAI_BASE_URL: ${AIAPP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AIAPP_OPENAI_MODEL: ${AIAPP_OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  appdata: